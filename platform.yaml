# Repo-wide settings shared by every product. A product is a folder under
# products/; its components are <section>/<name>/deployment.yml inside it.
org: acme                      # project IDs are {org}-{product}-{env}
region: europe-west1

# The team that owns this repo: CODEOWNERS (@{github_org}/{team}) and a `team` label.
github_org: acme
team: commerce

# Labels on every resource in the repo. Components add their own in deployment.yml.
# Reserved (set automatically): product, workload, workload-type, env, team, managed-by.
labels:
  cost-center: cc-123

# Where `cdk release` builds images (Cloud Build) and pushes them.
build_project: acme-cicd
registry: europe-west1-docker.pkg.dev/acme-artifacts/products   # image = {registry}/{product}/{component}:{sha}

# Principals that roll out releases. They get run.developer on each workload and
# serviceAccountUser on each runtime SA.
deployers:
  - serviceAccount:drone-release@acme-cicd.iam.gserviceaccount.com

envs:
  dev:
    state_bucket: acme-tfstate-dev
    deletion_protection: false
    vpc:
      network: projects/acme-net-dev/global/networks/shared
      subnetwork: projects/acme-net-dev/regions/europe-west1/subnetworks/serverless
  prod:
    state_bucket: acme-tfstate-prod
    deletion_protection: true
    vpc:
      network: projects/acme-net-prod/global/networks/shared
      subnetwork: projects/acme-net-prod/regions/europe-west1/subnetworks/serverless
