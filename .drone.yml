# Shared CI/CD for every product. No product has its own pipeline:
# `cdk check --affected` and `cdk release` work out which components a change touches.
#
#   PR / push           -> lint + test the repo, check affected components
#   push to main        -> build changed components (Cloud Build) -> deploy to dev
#   drone promote prod  -> deploy the images running in dev to prod (no rebuild)
#                          optional: -p PRODUCTS=orders,billing  -p COMPONENTS=orders/backend
#
# Tool versions match mise.toml (Renovate updates both).
---
kind: pipeline
type: docker
name: checks

trigger:
  event: [push, pull_request, promote]

steps:
  - name: terraform
    image: hashicorp/terraform:1.17.2
    commands:
      - terraform fmt -recursive -check -diff
      - |
        # module tests + a mocked plan of every product env (generated deploy/tests/plan.tftest.hcl)
        for m in platform/terraform/modules/*/ products/*/deploy/; do
          [ -d "$m/tests" ] || continue
          echo "== $m"
          (cd "$m" && terraform init -input=false -backend=false >/dev/null && terraform test) || exit 1
        done

  - name: tflint
    image: ghcr.io/terraform-linters/tflint:v0.59.1
    commands:
      - tflint --init --config "$PWD/.tflint.hcl"
      - tflint --recursive --config "$PWD/.tflint.hcl"

  - name: python
    image: ghcr.io/astral-sh/uv:0.13.6-python3.13-bookworm
    commands:
      - uv sync --locked
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run basedpyright
      - uv run pytest
      - uv run cdk sync --check

  - name: python-components
    image: ghcr.io/astral-sh/uv:0.13.6-python3.13-bookworm
    commands:
      - git fetch --quiet --unshallow || true
      - uv sync --locked
      - uv run cdk check --affected --lang python
    depends_on: [python]

  - name: node-components
    image: node:22-bookworm
    commands:
      - git fetch --quiet --unshallow || true
      - npm install -g pnpm@12.16.1
      - curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh && export PATH="$HOME/.local/bin:$PATH"
      - pnpm install --frozen-lockfile
      - pnpm exec biome ci .
      - uv run cdk check --affected --lang node --build

---
kind: pipeline
type: docker
name: release

trigger:
  event: [push, promote]

steps:
  - name: release-dev
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    environment:
      RELEASE_KEY:
        from_secret: drone_release_key   # drone-release@acme-cicd
    commands:
      - git fetch --quiet --unshallow || true   # history to diff against DRONE_COMMIT_BEFORE
      - curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh && export PATH="$HOME/.local/bin:$PATH"
      - echo "$RELEASE_KEY" > /tmp/key.json && gcloud auth activate-service-account --key-file=/tmp/key.json
      - uv run --locked cdk release dev
    when:
      event: push
      branch: main

  - name: promote-prod
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    environment:
      RELEASE_KEY:
        from_secret: drone_release_key
    commands:
      - curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh && export PATH="$HOME/.local/bin:$PATH"
      - echo "$RELEASE_KEY" > /tmp/key.json && gcloud auth activate-service-account --key-file=/tmp/key.json
      - uv run --locked cdk promote dev prod
    when:
      event: promote
      target: prod

depends_on: [checks]
