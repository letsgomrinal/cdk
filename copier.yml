# New product unit:
#   copier copy --vcs-ref v0.1.0 https://github.com/letsgomrinal/cdk.git <dest>
# Later, pull in template changes:
#   copier update --vcs-ref v0.2.0
_subdirectory: templates/product
_answers_file: .copier-answers.yml

product:
  type: str
  help: Product short code (2-10 chars, [a-z][a-z0-9]*). Prefix of every resource and SA name.
  validator: "{% if not (product | regex_search('^[a-z][a-z0-9]{1,9}$')) %}2-10 chars, lowercase letters/digits, starts with a letter, no hyphens{% endif %}"

team:
  type: str
  help: Owning team (label)

kit_version:
  type: str
  default: v0.1.0
  help: cdk git tag to pin in deploy/main.tf

region:
  type: str
  default: europe-west1

org_prefix:
  type: str
  default: acme
  help: Prefix for project IDs and state buckets

envs:
  type: str
  multiselect: true
  choices: [dev, staging, prod]
  default: [dev, prod]

deployer:
  type: str
  default: "serviceAccount:drone-release@acme-cicd.iam.gserviceaccount.com"
