# yaml-language-server: $schema=../../platform/schema/product.schema.json
#
# Infra for product "orders". Each section below is a deployment type; each entry
# in it is a component whose code lives in products/orders/<section>/<name>/.
# Add/remove with `cdk add|remove` (or by hand, then `cdk sync`). Reference: docs/PRODUCT_YAML.md
product: orders
team: commerce
envs: [dev, prod]

apps:           # frontends: Next.js, React (Cloud Run service)
  storefront:
    template: nextjs
    public: true          # internet-facing; delete this line to keep it internal
    calls: [backend]      # may invoke `backend`; its URL is injected as BACKEND_URL

apis:           # HTTP backends: FastAPI (Cloud Run service)
  backend:
    template: fastapi
    memory: 1Gi
    secret_env: { DB_URL: orders-db-url }    # access to the secret is granted automatically
    access: { publish: [orders-events] }

jobs:           # run to completion, optionally on a schedule (Cloud Run job)
  nightly-export:
    template: python-job
    args: [export]
    secret_env: { DB_URL: orders-db-url }
    schedules:
      daily: { cron: "0 2 * * *", time_zone: Europe/Berlin }
    access:
      buckets: { "acme-orders-exports-{env}": write }
      bigquery_datasets: { orders_analytics: write }

  reconcile:
    template: python-job
    task_count: 4
    calls: [backend]
    schedules:
      hourly: { cron: "15 * * * *" }
      weekly: { cron: "0 4 * * 0", args: ["--full"] }

workers:        # always-on queue/stream consumers (Cloud Run worker pool)
  email-sender:
    template: python-worker
    instances: 1
    env: { SUBSCRIPTION: "projects/{project}/subscriptions/orders-email-requests" }
    secret_env: { SMTP_PASSWORD: "orders-smtp-password:3" }
    access:
      subscribe: [orders-email-requests]
      buckets: { acme-orders-templates: read }

functions:      # react to events: GCS, Pub/Sub, ... (Cloud Run function + Eventarc)
  gcs-ingest:
    template: python-function
    access:
      buckets: { "acme-orders-inbox-{env}": read }
      publish: [orders-events]
    triggers:
      upload:
        event_type: google.cloud.storage.object.v1.finalized
        filters: { bucket: "acme-orders-inbox-{env}" }

# Per-env tweaks, shallow-merged into a component's settings:
overrides:
  prod:
    apis:
      backend: { min_instances: 2 }
    workers:
      email-sender: { instances: 4 }
