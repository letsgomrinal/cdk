# Workspace root: shared Python tooling and its config. Not a package.
#   uv sync          -> installs cdk + dev tools into .venv
#   uv run cdk ...   -> the repo CLI
[project]
name = "monorepo"
version = "0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "cdk",
    "basedpyright>=1.40",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tools/cdk"]
# Product components are standalone uv projects with their own uv.lock, because
# each one is its own Docker build context.
exclude = ["products/*/*/*", "platform/templates/components/*"]

[tool.uv.sources]
cdk = { workspace = true }

# ---------------------------------------------------------------- ruff (all Python in the repo)
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "S",            # bandit (security)
    "PTH",          # use pathlib
]
ignore = [
    "S603", "S607", # subprocess with git/gcloud/uv is the point of the CLI
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert is how pytest works

# basedpyright: see pyrightconfig.json (generated by `cdk sync`, so every Python
# component resolves imports from its own .venv in the editor and in `cdk check`)

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tools/cdk/tests"]
addopts = "-q"
