[project]
name = "cdk"
version = "0.2.0"
description = "Scaffold, sync, check and release products in this monorepo"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26",
    "ruamel.yaml>=0.19", # YAML 1.2, same dialect as Terraform's yamldecode
]

[project.scripts]
cdk = "cdk.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
